<svg viewBox="0 0 1180 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f8cff"/>
    </marker>
  </defs>
  <rect width="1180" height="900" fill="#0b1120"/>
  <text x="590" y="36" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">Enterprise Cyber Threat Intelligence &amp; Autonomous Security Investigation Platform</text>
  <text x="590" y="58" fill="#8a97ad" font-size="12" text-anchor="middle">Multi-Agent AI Architecture — Case Study AI-001</text>

  <!-- Data Sources -->
  <rect x="40" y="90" width="1100" height="70" rx="8" fill="#131c31" stroke="#23304a"/>
  <text x="590" y="115" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Security Data Pipeline — Firewall · Auth · Cloud · Endpoint · Network Flow Logs (data/generate_data.py)</text>
  <text x="590" y="138" fill="#8a97ad" font-size="11" text-anchor="middle">8,000+ synthetic flow records, CICIDS2017-style schema — swap point: Kafka + real SIEM exports</text>

  <line x1="590" y1="160" x2="590" y2="195" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent row title -->
  <text x="590" y="215" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Multi-Agent AI Workflow (agents/orchestrator.py)</text>

  <!-- Agent boxes -->
  <g font-size="11">
    <rect x="40" y="230" width="200" height="110" rx="8" fill="#131c31" stroke="#4f8cff"/>
    <text x="140" y="252" fill="#4f8cff" font-size="12" font-weight="700" text-anchor="middle">CorrelationAgent</text>
    <text x="140" y="272" fill="#8a97ad" text-anchor="middle">Rule engine +</text>
    <text x="140" y="286" fill="#8a97ad" text-anchor="middle">Isolation Forest</text>
    <text x="140" y="304" fill="#8a97ad" text-anchor="middle">anomaly detection</text>
    <text x="140" y="322" fill="#8a97ad" text-anchor="middle">(Threat Correlation Engine)</text>

    <rect x="256" y="230" width="200" height="110" rx="8" fill="#131c31" stroke="#4f8cff"/>
    <text x="356" y="252" fill="#4f8cff" font-size="12" font-weight="700" text-anchor="middle">ThreatHuntingAgent</text>
    <text x="356" y="272" fill="#8a97ad" text-anchor="middle">Multi-flow beaconing</text>
    <text x="356" y="286" fill="#8a97ad" text-anchor="middle">pattern hunting</text>
    <text x="356" y="304" fill="#8a97ad" text-anchor="middle">(bonus: AI Threat</text>
    <text x="356" y="322" fill="#8a97ad" text-anchor="middle">Hunting Agent)</text>

    <rect x="472" y="230" width="200" height="110" rx="8" fill="#131c31" stroke="#4f8cff"/>
    <text x="572" y="252" fill="#4f8cff" font-size="12" font-weight="700" text-anchor="middle">RiskAgent</text>
    <text x="572" y="272" fill="#8a97ad" text-anchor="middle">Risk scoring + XAI</text>
    <text x="572" y="286" fill="#8a97ad" text-anchor="middle">MITRE ATT&amp;CK mapping</text>
    <text x="572" y="304" fill="#8a97ad" text-anchor="middle">Malware family classifier</text>
    <text x="572" y="322" fill="#8a97ad" text-anchor="middle">Threat feed enrichment</text>

    <rect x="688" y="230" width="200" height="110" rx="8" fill="#131c31" stroke="#4f8cff"/>
    <text x="788" y="252" fill="#4f8cff" font-size="12" font-weight="700" text-anchor="middle">InvestigationAgent</text>
    <text x="788" y="272" fill="#8a97ad" text-anchor="middle">Knowledge Graph +</text>
    <text x="788" y="286" fill="#8a97ad" text-anchor="middle">Attack Graph Builder</text>
    <text x="788" y="304" fill="#8a97ad" text-anchor="middle">Structured incident</text>
    <text x="788" y="322" fill="#8a97ad" text-anchor="middle">reports (timeline, root cause)</text>

    <rect x="904" y="230" width="200" height="110" rx="8" fill="#131c31" stroke="#4f8cff"/>
    <text x="1004" y="252" fill="#4f8cff" font-size="12" font-weight="700" text-anchor="middle">ResponseAgent</text>
    <text x="1004" y="272" fill="#8a97ad" text-anchor="middle">Autonomous response</text>
    <text x="1004" y="286" fill="#8a97ad" text-anchor="middle">decisioning per incident</text>
    <text x="1004" y="304" fill="#8a97ad" text-anchor="middle">(bonus: Autonomous</text>
    <text x="1004" y="322" fill="#8a97ad" text-anchor="middle">AI SOC Analyst)</text>
  </g>

  <line x1="240" y1="285" x2="256" y2="285" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="456" y1="285" x2="472" y2="285" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672" y1="285" x2="688" y2="285" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="888" y1="285" x2="904" y2="285" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="590" y1="340" x2="590" y2="380" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Shared state -->
  <rect x="40" y="392" width="1100" height="46" rx="8" fill="#0e1626" stroke="#23304a" stroke-dasharray="4,3"/>
  <text x="590" y="420" fill="#8a97ad" font-size="12" text-anchor="middle">Shared blackboard state — processed DataFrame + NetworkX Knowledge Graph + Incident list (passed agent → agent)</text>

  <line x1="590" y1="438" x2="590" y2="472" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AI Components row -->
  <text x="590" y="492" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">AI Components</text>

  <g font-size="11">
    <rect x="40" y="505" width="255" height="90" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="167" y="528" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Anomaly Detection</text>
    <text x="167" y="548" fill="#8a97ad" text-anchor="middle">Isolation Forest (scikit-learn)</text>
    <text x="167" y="565" fill="#8a97ad" text-anchor="middle">unsupervised outlier scoring</text>
    <text x="167" y="582" fill="#8a97ad" text-anchor="middle">on flow features</text>

    <rect x="310" y="505" width="255" height="90" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="437" y="528" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">RAG Pipeline</text>
    <text x="437" y="548" fill="#8a97ad" text-anchor="middle">rag/vector_store.py (TF-IDF)</text>
    <text x="437" y="565" fill="#8a97ad" text-anchor="middle">+ rag/rag_pipeline.py</text>
    <text x="437" y="582" fill="#8a97ad" text-anchor="middle">retrieve → augment → generate</text>

    <rect x="580" y="505" width="255" height="90" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="707" y="528" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Vector Database</text>
    <text x="707" y="548" fill="#8a97ad" text-anchor="middle">TF-IDF + cosine kNN</text>
    <text x="707" y="565" fill="#8a97ad" text-anchor="middle">(sklearn NearestNeighbors)</text>
    <text x="707" y="582" fill="#8a97ad" text-anchor="middle">swap point: FAISS / ChromaDB</text>

    <rect x="850" y="505" width="255" height="90" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="977" y="528" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">LLM Summarization</text>
    <text x="977" y="548" fill="#8a97ad" text-anchor="middle">extractive fallback (no key)</text>
    <text x="977" y="565" fill="#8a97ad" text-anchor="middle">or Claude API generation</text>
    <text x="977" y="582" fill="#8a97ad" text-anchor="middle">(ANTHROPIC_API_KEY)</text>
  </g>

  <g font-size="11">
    <rect x="40" y="610" width="255" height="80" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="167" y="633" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Knowledge Graph</text>
    <text x="167" y="653" fill="#8a97ad" text-anchor="middle">NetworkX MultiDiGraph</text>
    <text x="167" y="670" fill="#8a97ad" text-anchor="middle">User → SrcIP → DstIP edges</text>

    <rect x="310" y="610" width="255" height="80" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="437" y="633" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Attack Graph Builder</text>
    <text x="437" y="653" fill="#8a97ad" text-anchor="middle">Time-ordered chain per entity</text>
    <text x="437" y="670" fill="#8a97ad" text-anchor="middle">Initial Access → ... → Impact</text>

    <rect x="580" y="610" width="255" height="80" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="707" y="633" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Malware Family Classifier</text>
    <text x="707" y="653" fill="#8a97ad" text-anchor="middle">Signature/heuristic engine</text>
    <text x="707" y="670" fill="#8a97ad" text-anchor="middle">(bonus challenge)</text>

    <rect x="850" y="610" width="255" height="80" rx="8" fill="#131c31" stroke="#23304a"/>
    <text x="977" y="633" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Threat Intel Feed Aggregation</text>
    <text x="977" y="653" fill="#8a97ad" text-anchor="middle">Multi-source IOC merge</text>
    <text x="977" y="670" fill="#8a97ad" text-anchor="middle">(bonus challenge)</text>
  </g>

  <text x="590" y="722" fill="#8a97ad" font-size="10" text-anchor="middle" font-style="italic">Graph Neural Network layer (concept, per case study spec): would score lateral-movement</text>
  <text x="590" y="736" fill="#8a97ad" font-size="10" text-anchor="middle" font-style="italic">likelihood along attack-graph edges — production swap point, needs labeled attack-path data. Not implemented in this prototype.</text>

  <line x1="590" y1="690" x2="590" y2="758" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Delivery layer -->
  <rect x="40" y="770" width="530" height="100" rx="8" fill="#131c31" stroke="#23304a"/>
  <text x="305" y="795" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Threat Intelligence Dashboard (Flask)</text>
  <text x="305" y="815" fill="#8a97ad" font-size="11" text-anchor="middle">Live stats · Attack/MITRE charts · Alert feed</text>
  <text x="305" y="832" fill="#8a97ad" font-size="11" text-anchor="middle">Incident investigations · Agent collaboration log</text>
  <text x="305" y="849" fill="#8a97ad" font-size="11" text-anchor="middle">Malware families · Threat feed matches</text>

  <rect x="610" y="770" width="530" height="100" rx="8" fill="#131c31" stroke="#23304a"/>
  <text x="875" y="795" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">AI Security Copilot</text>
  <text x="875" y="815" fill="#8a97ad" font-size="11" text-anchor="middle">Fast-path intents (top attacks, risk, users)</text>
  <text x="875" y="832" fill="#8a97ad" font-size="11" text-anchor="middle">+ RAG fallback for open-ended questions</text>
  <text x="875" y="849" fill="#8a97ad" font-size="11" text-anchor="middle">Terminal (run_copilot.py) or Web chat widget</text>
</svg>
